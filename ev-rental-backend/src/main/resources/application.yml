server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nev_rental?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "040414"
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ev-rental-platform-jwt-secret-key-2024-must-be-long-enough
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 文件上传
file:
  upload-path: D:/ev-rental/upload/

# 支付宝沙箱配置
# 沙箱环境申请：https://open.alipay.com 账号登录后 -> 控制台 -> 沙箱
alipay:
  app-id: 9021000164649259
  private-key: 
  alipay-public-key: 
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  return-url: http://localhost:5173/pay/success
  notify-url: http://localhost:8080/api/pay/notify

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
